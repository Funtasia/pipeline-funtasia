[project]
name = "funtasia-pipeline"
dynamic = ["version"]
requires-python = ">= 3.13"
description = "Tool to generate assets for Funtasia 3D map"
readme = "README.md"

dependencies = [
  "httpx==0.28",
  "typer==0.28",
  "colorama==0.4.6; os_name == 'nt'",
]

classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Natural Language :: English",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15"
]

[project.scripts]
nipple = "pipeline.cli:app"

[project.urls]
Repository = "https://github.com/Funtasia/pipeline-funtasia"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pipeline/__about__.py"

[tool.hatch.build.targets.sdist]
only-include = [
  "src/pipeline",
  "pyproject.toml",
  "README.md"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
