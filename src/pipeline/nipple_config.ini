[general]
version = 0.0.0

[dir]
; all other paths are relative to the project root
root = 
app = app-funtasia
assets = assets-funtasia

[model_convert]
; Path to the blender executable if not in $PATH
blender_exe = blender.exe
; Path to the script to process .blend to .glb
blender_script = 3dfiles-funtasia/misc/scripts/blender_script.py

; Default folder to convert .skp files from
skp_folder = 3dfiles-funtasia/.skp
; Default folder to store temporary .blend files
blend_folder = 3dfiles-funtasia/.blend
; Default folder to store converted .glb files
glb_folder = app-funtasia/assets/funtasia/model

; No. of times to try converting .skp to .blend
upload_attempts = 2